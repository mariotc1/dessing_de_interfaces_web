<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejemplos Grid Layout</title>
        <style>
            #contenedor {
                display: grid;
                grid-template-columns: repeat(2, 1fr) 3fr repeat(2, 1fr);
                grid-template-rows: 100px auto;
            }

            p {
                border: 1px solid black;
                margin: 0;
            }

            p:nth-of-type(1) {
                color: red;
                grid-column: 3/4;
                grid-row: 1/2;
            }

            p:nth-of-type(2) {
                color: blue;
                grid-column: 4/5;
                grid-row: 1/2;
            }
        </style>
    </head>
    <body>
        <div id="contenedor">
            <p>Párrafo 1</p>
            <p>Párrafo 2</p>
            <p>Parrafo 3</p>
            <p>Párrafo 4</p>
            <p>Párrafo 5</p>
            <p>Párrafo 6</p>
            <p>Párrafo 7</p>
            <p>Párrafo 8</p>
            <p>Párrafo 9</p>
            <p>Párrafo 10</p>
            <p>Párrafo 11</p>
            <p>Párrafo 12</p>
            <p>Párrafo 13</p>
            <p>Párrafo 14</p>
            <p>Párrafo 15</p>
        </div>
    </body>
</html>
