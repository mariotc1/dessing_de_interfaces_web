<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Tu Nombre Completo">
        <meta name="creation-date" content="2025-10-31">
        <title>Formulario de Solicitud de Zapatos</title>
    </head>
    <body>

        <h1>Formulario de solicitud de zapatos</h1>

        <form method="get" action="">
            
            <fieldset>
                <legend>Información personal</legend>
                
                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </p>
                
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </p>

                <p>
                    <label for="historia">Cuéntanos tu historia...</label><br>
                    <textarea id="historia" name="historia" maxlength="300" rows="5" cols="40"></textarea><br>
                    <small>No más de 300 caracteres</small>
                </p>
            </fieldset>

            <h2>Diseña tus zapatos:</h2>
            
            <fieldset>
                <legend>Diseño personalizado</legend>

                <fieldset>
                    <legend>Color (elige uno):</legend>
                    <input type="radio" id="color_rojo" name="color" value="rojo">
                    <label for="color_rojo">Rojo</label><br>
                    
                    <input type="radio" id="color_azul" name="color" value="azul">
                    <label for="color_azul">Azul</label><br>
                    
                    <input type="radio" id="color_negro" name="color" value="negro">
                    <label for="color_negro">Negro</label><br>
                    
                    <input type="radio" id="color_plata" name="color" value="plata">
                    <label for="color_plata">Plata</label><br>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Características (Elige las que quieras)</legend>
                    <input type="checkbox" id="check_cordones" name="cordones" value="si">
                    <label for="check_cordones">Con cordones</label><br>

                    <input type="checkbox" id="check_logo" name="logo" value="si" checked>
                    <label for="check_logo">Logo metálico</label><br>

                    <input type="checkbox" id="check_ligeras" name="ligeras" value="si">
                    <label for="check_ligeras">Ligeras</label><br>

                    <input type="checkbox" id="check_musica" name="musica" value="si">
                    <label for="check_musica">Con música</label><br>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Tamaño</legend>
                    <label for="talla">Tamaño de los zapatos:</label>
                    <select id="talla" name="talla">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5" selected>5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </fieldset>

            </fieldset>
            
            <br>

            <input type="submit" value="Solicitar">
            <input type="reset" value="Restablecer">
            
        </form>

    </body>
</html>
