<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Tu Nombre Completo">
        <meta name="creation-date" content="2025-10-30">
        <title>Formulario con Opciones</title>
    </head>
    <body>
        <form method="get" action="">
            <fieldset>
                <legend>Únete</legend>
                <p>Nuestros socios tienen muchas ventajas. ¡Y es gratis!</p>
                
                <label for="nombre_apellidos">Nombre y apellidos:</label>
                <input type="text" id="nombre_apellidos" name="nombre_apellidos">
                
                <br><br>

                <p><strong>Edad:</strong></p>
                <input type="radio" id="edad1" name="edad" value="menos_20">
                <label for="edad1">Menos de 20</label><br>
                
                <input type="radio" id="edad2" name="edad" value="20_40">
                <label for="edad2">Entre 20 y 40</label><br>
                
                <input type="radio" id="edad3" name="edad" value="40_60">
                <label for="edad3">Entre 40 y 60</label><br>
                
                <input type="radio" id="edad4" name="edad" value="mas_60">
                <label for="edad4">Más de 60</label><br>

                <br>

                <p><strong>Estudios:</strong></p>
                <input type="checkbox" id="estudio1" name="estudio_bachiller" value="si">
                <label for="estudio1">Bachiller</label><br>
                
                <input type="checkbox" id="estudio2" name="estudio_fp" value="si">
                <label for="estudio2">Formación Profesional</label><br>
                
                <input type="checkbox" id="estudio3" name="estudio_ingles" value="si">
                <label for="estudio3">Inglés B2</label><br>
                
                <input type="checkbox" id="estudio4" name="estudio_frances" value="si">
                <label for="estudio4">Francés B2</label><br>

                <br>
                
                <input type="submit" value="Enviar">
            </fieldset>
        </form>
    </body>
</html>
