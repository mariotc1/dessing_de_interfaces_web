<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Tu Nombre Completo">
        <meta name="creation-date" content="2025-10-30">
        <title>Formulario de Fechas</title>
    </head>
    <body>

        <form method="get" action="">
            <fieldset>
                <legend>Únete</legend>
                <p>Nuestros socios tienen muchas ventajas. ¡Y es gratis!</p>
                
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" value="2012-12-15">
                
                <br><br>

                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora" value="12:30">

                <br><br>

                <label for="fecha_hora">Fecha y hora:</label>
                <input type="datetime" id="fecha_hora" name="fecha_hora" value="2012-12-15T12:30">

                <br><br>

                <label for="fecha_hora_local">Fecha y hora (local):</label>
                <input type="datetime-local" id="fecha_hora_local" name="fecha_hora_local" value="2012-12-15T12:30">

                <br><br>

                <label for="mes">Mes:</label>
                <input type="month" id="mes" name="mes" value="2012-12">

                <br><br>

                <label for="semana">Semana:</label>
                <input type="week" id="semana" name="semana" value="2012-W50">

                <br><br>

                <input type="submit" value="Enviar">
            </fieldset>
        </form>

    </body>
</html>
