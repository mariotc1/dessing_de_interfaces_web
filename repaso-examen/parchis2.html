<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parchis con DIV</title>
        <style>
            /* CENTRAR EL TABLERO */
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            /* CONTENEDOR PADRE */
            .tablero {
                position: relative;
                width: 400px;
                height: 400px;
                background-color: #d3d3d3;
                border: 8px solid #a9a9a9;
                box-sizing: border-box;
            }

            /* ESTILO PARA LAS FICHAS */
            .ficha {
                position: absolute;
                width: 100px;
                height: 100px;
                border-radius: 50%;
                border: 6px solid #a9a9a9;
            }

            /* POSICIONAMIENTO Y COLOR PARA CADA UNO*/

            /* rojo arriba izquierda */
            .rojo {
                background-color: red;
                top: 20px;
                left: 20px;
            }

            /* verde arriba derecha */
            .verde {
                background-color: green;
                top: 20px;
                right: 20px;
            }   
            
            /* amarillo abajo izquierda */
            .amarillo {
                background-color: yellow;
                bottom: 20px;
                left: 20px;
            }

            /* azul abajo derecha */
            .azul {
                background-color: blue;
                bottom: 20px;
                right: 20px;
            }
        </style>
    </head>
    <body>
        <div class="tablero">
            <div class="ficha rojo"></div>
            <div class="ficha verde"></div>
            <div class="ficha amarillo"></div>
            <div class="ficha azul"></div>
        </div>
    </body>
</html>
