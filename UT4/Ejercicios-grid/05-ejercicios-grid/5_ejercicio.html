<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 5: Grid Avanzado</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>
        <h3>a) Superposición de ítems</h3>
        <div class="grid-a">
            <div class="box item-a">A</div>
            <div class="box item-b">B</div>
            <div class="box item-c">C</div>
            <div class="box item-d">D</div>
            <div class="box item-f">F</div> 
            <div class="box item-e">E</div>
        </div>

        <h3>b) Anidación de Grid</h3>
        <div class="grid-b">
            <div class="box item-a">A</div>
            <div class="box item-b">B</div>
            <div class="box item-c">C</div>
            <div class="box item-d-wrapper">
                <div class="box sub-item-e">E</div>
                <div class="box sub-item-f">F</div>
                <div class="box sub-item-g">G</div>
            </div>
        </div>

        <h3>c) Auto-flow por columnas</h3>
        <div class="grid-c">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
            <div class="box">10</div>
            <div class="box">11</div>
            <div class="box">12</div>
        </div>
    </body>
</html>
