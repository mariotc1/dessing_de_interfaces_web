<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formularios</title>
    </head>
    <body>
        <h1>Ejemplo de formulario</h1>

        <!-- 
            como no hay backend poner una # y usar metodo get para enviar datos 
            pongo un nombre para poder usarlo fuera (JavaScript por ejemplo)
        -->
        <form action="#" method="get" name="formEjemplo">

            <!-- poner un label por accesibilidad y asigno el id del input con for -->
            <label for="idNombre">Nombre:</label>
            <input type="text" id="idNombre" name="nombre">

            <br><br>

            <label for="idEmail">Email:</label>
            <input type="email" id="idEmail" name="email">

            <br><br>

            <label for="idPassword">Contraseña:</label>
            <input type="password" id="idPassword" name="password">

            <br><br>

            <label for="idEdad">Edad:</label>
            <input type="number" id="idEdad" name="edad" min="18" max="100" step="1">

            <br><br>

            <label for="idTelefono">Teléfono:</label>
            <input type="tel" id="idTelefono" name="telefono">

            <br><br>

            <label for="idUrl">Página web:</label>
            <input type="url" id="idUrl" name="url">
        
            <br><br>

            <label for="idColor">Color favorito:</label>
            <input type="color" id="idColor" name="color">

            <br><br>

            <label for="idFecha">Fecha de nacimiento:</label>
            <input type="date" id="idFecha" name="fecha">

            <br><br>

            <label for="idHora">Hora de cita:</label>
            <input type="time" id="idHora" name="hora">

            <br><br>

            <!-- Radio buttons para seleccionar el módulo -->
            <input type="radio" name="modulo" id="idModulo1" value="modulo1">
            <label for="idModulo1">DWEC</label>

            <input type="radio" name="modulo" id="idModulo2" value="modulo2">
            <label for="idModulo2">DWES</label>

            <br><br>

            <!-- Select para elegir el turno -->
            <label for="idTurno">Turno:</label>
            <select name="turno" id="idTurno">
                <option value="Diurno">Diurno</option>
                <option value="Nocturno">Nocturno</option>
            </select>

            <br><br>

            <!-- Datalist para sugerir ciudades -->
            <data-lists>
                <label for="idCiudad">Ciudad:</label>
                <input list="ciudades" id="idCiudad" name="ciudad">
                <datalist id="ciudades">
                    <option value="Madrid">
                    <option value="Barcelona">
                    <option value="Valencia">
                    <option value="Sevilla">
                    <option value="Zaragoza">
                </datalist>
            </data-lists>

            <br><br>

            <!-- Textarea para poner la opinion -->
            <label for="idOpinion">Opinión:</label>
            <textarea id="idOpinion" name="opinion" rows="4" cols="50" placeholder="Escribe tu opinión aquí..."></textarea>

            <br><br>

            <!-- 2 formas de enviar (más moderno es usar button) -->
            <input type="submit" value="Enviar" id="btnEnviar">
            <button type="reset">Borrar</button>

        </form>

        <script>
            let btn = document.getElementById("btnEnviar");
            btn.addEventListener("click",(evento) => {
                evento.preventDefault(); // Prevenir el envío del formulario
                
                console.log(formEjemplo.nombre.value);
                console.log(formEjemplo.email.value);
                console.log(formEjemplo.password.value);
                console.log(formEjemplo.edad.value);
                console.log(formEjemplo.telefono.value);
                console.log(formEjemplo.url.value);
                console.log(formEjemplo.color.value);
                console.log(formEjemplo.fecha.value);
                console.log(formEjemplo.hora.value);
                console.log(formEjemplo.modulo.value);
                console.log(formEjemplo.turno.value);
                console.log(formEjemplo.ciudad.value);
                console.log(formEjemplo.opinion.value);

                // Buscar si ya existe un mensaje de error
                let mensajeExistente = document.getElementById("mensajeError");
                
                if(formEjemplo.password.value.length < 8){
                    // Si no existe el mensaje, crearlo
                    if(!mensajeExistente) {
                        let info = document.createElement("p");
                        info.id = "mensajeError";
                        info.style.color = "red";
                        info.textContent = "La contraseña debe tener al menos 8 caracteres";
                        formEjemplo.password.insertAdjacentElement("afterend", info);
                    }
                } else {
                    // Si existe el mensaje de error, eliminarlo
                    if(mensajeExistente) {
                        mensajeExistente.remove();
                    }
                    // Aquí podrías enviar el formulario si quisieras
                    console.log("Formulario válido - se podría enviar");
                }
            });
        </script>
    </body>
</html>
