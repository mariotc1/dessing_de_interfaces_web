<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Tu Nombre Completo">
        <meta name="creation-date" content="2025-10-30">
        <title>Formulario con Controles Especiales</title>
    </head>

    <body>
        <form method="get" action="">
            <fieldset>
                <legend>Únete</legend>
                <p>Nuestros socios tienen muchas ventajas. ¡Y es gratis!</p>
                
                <label for="nota">Nota:</label>
                <input type="number" id="nota" name="nota" value="0">
                
                <br><br>

                <label for="edad">Edad:</label>
                <input type="range" id="edad" name="edad" value="50">

                <br><br>

                <label for="color">Color:</label>
                <input type="color" id="color" name="color" value="#ff0000">
                
                <br><br>

                <input type="submit" value="Enviar">
            </fieldset>
        </form>
    </body>
</html>
