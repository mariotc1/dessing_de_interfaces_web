<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Tu Nombre Completo">
        <meta name="creation-date" content="2025-10-29">
        <title>Formulario de Suscripción</title>
    </head>

    <body>

        <form method="get" action="">
            <fieldset>
                <legend>Únete</legend>
                <p>Nuestros socios tienen muchas ventajas. ¡Y es gratis!</p>
                
                <!-- Etiqueta y campo para Nombre y Apellidos -->
                <label for="nombre_apellidos">Nombre y apellidos:</label>
                <input type="text" id="nombre_apellidos" name="nombre_apellidos">
                
                <br><br>

                <!-- etiqueta y campo para Email -->
                <label for="email_usuario">Email:</label>
                <input type="email" id="email_usuario" name="email_usuario">
                
                <br><br>

                <!-- botón de envío -->
                <input type="submit" value="Enviar">
            </fieldset>
        </form>

    </body>
</html>
