<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Examen DAW - Diseño Interfaces</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <div class="layout-container">
            <header class="top-bar">
                <div class="logo">DAW Dashboard</div>
                <nav class="main-nav">
                    <a href="#">Perfil</a>
                    <a href="#">Ajustes</a>
                    <a href="#">Salir</a>
                </nav>
            </header>

            <aside class="sidebar">
                <ul>
                    <li>Inicio</li>
                    <li>Estadísticas</li>
                    <li>Usuarios</li>
                    <li>Reportes</li>
                </ul>
            </aside>

            <main class="content-area">
                <h1>Resumen del Mes</h1>
                
                <div class="cards-container">
                    <div class="card">
                        <h3>Visitas</h3>
                        <span class="number">1024</span>
                    </div>
                    <div class="card">
                        <h3>Ventas</h3>
                        <span class="number">85</span>
                    </div>
                    <div class="card">
                        <h3>Errores</h3>
                        <span class="number">2</span>
                    </div>
                    <div class="card">
                        <h3>Tiempo</h3>
                        <span class="number">5m</span>
                    </div>
                </div>
            </main>

            <footer class="main-footer">
                <p>&copy; 2025 Alumno DAM - Examen Interfaces</p>
            </footer>
        </div>

    </body>
</html>
