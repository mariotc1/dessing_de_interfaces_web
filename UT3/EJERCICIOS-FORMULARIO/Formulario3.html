<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Tu Nombre Completo">
        <meta name="creation-date" content="2025-10-29">
        <title>Formulario con Textareas</title>
    </head>

    <body>

        <form method="get" action="">
            <fieldset>
                <legend>Únete</legend>
                <p>Nuestros socios tienen muchas ventajas. ¡Y es gratis!</p>
                
                <label for="nombre_apellidos">Nombre y apellidos:</label>
                <input type="text" id="nombre_apellidos" name="nombre_apellidos">
                
                <br><br>

                <label for="email_usuario">Email:</label>
                <input type="email" id="email_usuario" name="email_usuario">

                <br><br>

                <label for="comentario_soft">Comentario:</label>
                <textarea id="comentario_soft" name="comentario_soft" placeholder="Escribe aquí tu comentario"></textarea>

                <br><br>

                <label for="comentario_hard">Comentario:</label>
                <textarea id="comentario_hard" name="comentario_hard" placeholder="Escribe aquí tu comentario" cols="22" wrap="hard"></textarea>
                
                <br><br>

                <input type="submit" value="Enviar">
            </fieldset>
        </form>

    </body>
</html>
